# ==========================================
# SERVER
# ==========================================
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
server.error.include-message=always
spring.main.web-application-type=servlet
# Temporarily preserved for compatibility
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true
# ==========================================
# DATABASE - POSTGRESQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talk_space}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
# IMPORTANT: Do not use create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
# ==========================================
# EMAIL - GMAIL SMTP
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:talkspace783@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# ==========================================
# MULTIPART UPLOADS
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# ==========================================
# LOGGING
# ==========================================
logging.level.root=INFO
logging.level.com.talk_space=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.file.name=${LOG_FILE:logs/talk-space.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger : %msg%n
app.logging.enabled=true
app.logging.level=INFO
# ==========================================
# SPRING BOOT ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.defaults.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# ==========================================
# APPLICATION INFORMATION
# ==========================================
management.info.env.enabled=true
info.app.name=TalkSpace
info.app.description=TalkSpace Social Networking Platform
info.app.version=0.0.1
