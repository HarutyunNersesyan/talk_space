# ==========================================
# SERVER
# ==========================================
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
server.error.include-message=always
spring.main.web-application-type=servlet
# Temporarily preserved for compatibility
spring.main.allow-circular-references=false
spring.main.allow-bean-definition-overriding=true
# ==========================================
# DATABASE - POSTGRESQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talk_space}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
# IMPORTANT: Do not use create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
# ==========================================
# EMAIL - GMAIL SMTP
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:talkspace2027@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# ==========================================
# MULTIPART UPLOADS
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# ==========================================
# LOGGING
# ==========================================
logging.level.root=INFO
logging.level.com.talk_space=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.file.name=${LOG_FILE:logs/talk-space.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger : %msg%n
app.logging.enabled=true
app.logging.level=INFO
# ==========================================
# SPRING BOOT ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.health.defaults.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# ==========================================
# APPLICATION INFORMATION
# ==========================================
management.info.env.enabled=true
info.app.name=TalkSpace
info.app.description=TalkSpace Social Networking Platform
info.app.version=0.0.1

# Ranked matching: exact traits + discounted shared categories.
app.matching.candidate-limit=500
app.matching.history-days=7
app.matching.primary-weight=0.8
app.matching.parent-weight=0.35
app.demo-seed.enabled=${DEMO_SEED_ENABLED:true}

# Optional Redis. Disabled locally; enabled by Docker Compose.
app.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=${REDIS_ENABLED:false}

# Elasticsearch search is additive; matching continues to use PostgreSQL.
app.search.enabled=${SEARCH_ENABLED:false}
app.search.url=${ELASTICSEARCH_URL:http://localhost:9200}
app.search.initial-delay-ms=10000
app.search.sync-delay-ms=60000
management.metrics.tags.application=talkspace
management.endpoint.prometheus.enabled=true

app.images.directory=${IMAGE_DIRECTORY:C:/Users/HARUT_037/Desktop/talk_space/images/}

# Matching v2: exact overlap + discounted category overlap; diversity stays near the best score.
app.matching.exact-weight=0.7
app.matching.diversity-pool=10
app.matching.diversity-window=0.08
app.matching.skip-hours=24
app.matching.pending-hours=24
app.matching.rejected-days=7
app.matching.cancelled-hours=48

# Flyway: baseline existing PostgreSQL schemas without recreating them.
# Hibernate remains responsible for the legacy baseline while migrations are introduced.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
